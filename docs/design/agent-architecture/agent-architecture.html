<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeReader Agent 子系统架构</title>
<style>
  :root{
    --bg:#0a0f1c; --panel:#0e1626; --line:rgba(148,163,184,.16);
    --ink:#cbd5e1; --muted:#64748b; --amber:#fbbf24; --debt:#f87171; --store:#5eead4;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:
      linear-gradient(rgba(148,163,184,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148,163,184,.045) 1px, transparent 1px),
      radial-gradient(1200px 700px at 70% -10%, #12203a 0%, var(--bg) 60%);
    background-size:32px 32px, 32px 32px, cover;
    color:var(--ink); font:14px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  h1,h2,h3{font-family:"Songti SC","STSong",serif}
  header{display:flex; align-items:baseline; gap:16px; padding:14px 22px 10px; border-bottom:1px solid var(--line); flex-wrap:wrap}
  header h1{font-size:20px; color:#e2e8f0} header h1 em{color:var(--amber); font-style:normal}
  header .meta{color:var(--muted); font-size:12px}
  .tabs{margin-left:auto; display:flex; gap:6px}
  .tab{padding:5px 14px; border:1px solid var(--line); border-radius:3px; cursor:pointer; color:var(--muted); font-size:13px; background:transparent}
  .tab.on{color:#0a0f1c; background:var(--amber); border-color:var(--amber); font-weight:600}
  main{flex:1; display:flex; min-height:0}
  #stage{flex:1; position:relative; min-width:0}
  svg#arch{width:100%; height:100%; display:block; cursor:grab}
  svg#arch.dragging{cursor:grabbing}
  .zoombar{position:absolute; top:12px; right:12px; display:flex; gap:6px}
  .zoombar button{width:32px; height:30px; border:1px solid var(--line); background:rgba(14,22,38,.9); color:var(--ink); border-radius:3px; cursor:pointer; font-size:14px}
  .zoombar button:hover{border-color:var(--amber); color:var(--amber)}
  .legend{position:absolute; left:12px; bottom:12px; padding:8px 12px; font-size:11.5px; color:var(--muted); background:rgba(10,15,28,.85); border:1px solid var(--line); border-radius:3px; line-height:2}
  .bandlabel{fill:#475569; font-size:11px; letter-spacing:.25em; font-family:"SF Mono",Menlo,monospace}
  .node{cursor:pointer} .node rect.box{fill:rgba(17,28,48,.92); stroke:rgba(148,163,184,.4); stroke-width:1.2}
  .node:hover rect.box{stroke:var(--amber); stroke-width:1.6}
  .node.hl rect.box{stroke:var(--amber); stroke-width:2.2; fill:rgba(60,45,10,.5)}
  .node.dim{opacity:.18}
  .node .t{fill:#e2e8f0; font-size:14px; font-weight:600}
  .node .s{fill:#94a3b8; font-size:11px}
  .node .m{fill:#5eead4; font-size:10.5px; font-family:"SF Mono",Menlo,monospace}
  .badge{fill:#7f1d1d; stroke:var(--debt)} .badge text{fill:#fecaca; font-size:9px; font-family:"SF Mono",Menlo,monospace}
  .edge{stroke:rgba(148,163,184,.5); stroke-width:1.4; fill:none}
  .edge.dashed{stroke-dasharray:5 4} .edge.red{stroke:var(--debt); stroke-dasharray:5 4}
  .edge.dotted{stroke-dasharray:2 4; stroke:#818cf8}
  .elabel{fill:#94a3b8; font-size:10.5px; paint-order:stroke; stroke:#0a0f1c; stroke-width:4px}
  .elabel.red{fill:var(--debt)}
  aside{width:360px; border-left:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0}
  aside .head{padding:12px 16px 8px; border-bottom:1px solid var(--line); display:flex; gap:8px}
  .chip{padding:3px 10px; font-size:12px; border:1px solid var(--line); border-radius:2px; cursor:pointer; color:var(--muted)}
  .chip.on{color:var(--amber); border-color:var(--amber)}
  #sidebody{flex:1; overflow-y:auto; padding:12px 16px 20px}
  .flow{border:1px solid var(--line); border-radius:4px; margin-bottom:10px; overflow:hidden}
  .flow>.t{padding:9px 12px; cursor:pointer; font-weight:600; color:#e2e8f0; display:flex; justify-content:space-between}
  .flow>.t small{color:var(--muted); font-weight:400}
  .flow ol{display:none; list-style:none; counter-reset:st}
  .flow.open ol{display:block}
  .flow li{counter-increment:st; padding:8px 12px 8px 38px; position:relative; cursor:pointer; border-top:1px solid var(--line); font-size:12.5px}
  .flow li::before{content:counter(st); position:absolute; left:12px; top:9px; width:17px; height:17px; border:1px solid var(--muted); border-radius:50%; font-size:10px; color:var(--muted); display:flex; align-items:center; justify-content:center; font-family:"SF Mono",Menlo,monospace}
  .flow li.on{background:rgba(251,191,36,.12); color:#fde68a}
  .flow li.on::before{border-color:var(--amber); color:var(--amber)}
  .insp h3{font-size:16px; color:#fde68a; margin-bottom:8px}
  .insp section{margin-bottom:14px}
  .insp b{color:#e2e8f0; font-size:12px; display:block; margin-bottom:3px; letter-spacing:.08em}
  .insp p,.insp li{font-size:12.5px} .insp ul{padding-left:16px}
  .insp .dt{color:#fca5a5; font-size:12px; cursor:pointer} .insp .dt:hover{text-decoration:underline}
  .insp code{color:var(--store); font-size:11.5px}
  .hint{color:var(--muted); font-size:12px; padding:8px 0}
  #debtview{flex:1; overflow-y:auto; padding:20px 28px 40px; display:none}
  .debtgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:14px; margin-top:14px}
  .dcard{border:1px solid var(--line); border-left:3px solid var(--debt); border-radius:4px; background:var(--panel); padding:13px 15px}
  .dcard h3{font-size:14px; color:#e2e8f0; margin-bottom:6px}
  .dcard h3 .did{color:var(--debt); font-family:"SF Mono",Menlo,monospace; font-size:12px; margin-right:6px}
  .dcard .g{float:right; font-size:10.5px; color:var(--muted); border:1px solid var(--line); padding:1px 7px; border-radius:2px}
  .dcard p{font-size:12px; margin-bottom:6px} .dcard .ev{font-size:11px; color:var(--muted)} .dcard .ev code{color:var(--store); font-size:10.5px}
  .dcard .rem{font-size:12px; color:#86efac; margin-top:6px} .dcard .rem::before{content:"建议 "; color:var(--muted); font-size:10.5px}
  .grouphead{margin:22px 0 2px; color:var(--amber); font-size:13px; letter-spacing:.2em; font-family:"SF Mono",Menlo,monospace}
</style>
</head>

/* SVG */
const svg=document.getElementById('arch'), NS='http://www.w3.org/2000/svg';
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e}
function txt(x,y,s,c,p){const t=el('text',{x,y,class:c||''},p);t.textContent=s;return t}
function band(x,y,w,h,label){el('rect',{x,y,width:w,height:h,fill:'none',stroke:'rgba(148,163,184,.10)','stroke-dasharray':'3 5',rx:6});txt(x+12,y-8,label,'bandlabel')}
band(20,60,1600,120,'HOST · App.jsx');
band(20,210,1600,160,'ORCHESTRATION');
band(20,400,1600,200,'AGENT LOOP KERNEL · src/agent/runtime');
band(20,630,1600,180,'MODEL & SKILLS');
band(20,840,1600,150,'TOOLS & SUPPORT');
function anchor(id,s){const b=BOX[id];if(s==='r')return{x:b.x+b.w,y:b.y+b.h/2};if(s==='l')return{x:b.x,y:b.y+b.h/2};if(s==='t')return{x:b.x+b.w/2,y:b.y};return{x:b.x+b.w/2,y:b.y+b.h}}
EDGES.forEach(e=>{
  const A=anchor(e.from,'b'),B=anchor(e.to,'t');
  let a=A,b=B;
  if(e.from==='host'){a={x:anchor('host','b').x-300,y:anchor('host','b').y}}
  if(e.to==='rt'){b={x:300,y:BOX.rt.y}}
  if(e.to==='tools'){b={x:390,y:BOX.tools.y}}
  const mx=(a.x+b.x)/2;
  const p=el('path',{class:'edge'+(e.red?' red':'')+(e.dashed?' dashed':''),d:`M${a.x},${a.y} C${mx},${a.y} ${mx},${b.y} ${b.x},${b.y}`});
  if(e.label){const m=p.getPointAtLength(p.getTotalLength()*0.5);const t=txt(m.x,m.y-5,e.label,'elabel'+(e.red?' red':''));t.setAttribute('text-anchor','middle')}
});
for(const id in BOX){
  const b=BOX[id];
  const g=el('g',{class:'node','data-id':id});
  el('rect',{class:'box',x:b.x,y:b.y,width:b.w,height:b.h,rx:4},g);
  txt(b.x+14,b.y+24,NODES[id].name,'t',g);
  txt(b.x+14,b.y+44,b.s,'s',g);
  txt(b.x+14,b.y+63,b.m,'m',g);
  (b.debts||[]).forEach((d,i)=>{const bx=b.x+b.w-34,by=b.y+8+i*15;el('rect',{class:'badge',x:bx,y:by,width:27,height:12,rx:2},g);txt(bx+4,by+9.5,d,'',g)});
  g.addEventListener('click',ev=>{ev.stopPropagation();inspect(id)});
}
/* 缩放平移 */
let vb={x:0,y:0,w:1640,h:1020};
function applyVB(){svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`)}
function zoom(f,cx,cy){const nw=Math.min(4000,Math.max(500,vb.w*f));const r=nw/vb.w;cx=cx??vb.x+vb.w/2;cy=cy??vb.y+vb.h/2;vb={x:cx-(cx-vb.x)*r,y:cy-(cy-vb.y)*r,w:nw,h:vb.h*r};applyVB()}
svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.12:0.89,vb.x+e.offsetX/vb.clientWidth*vb.w,vb.y+e.offsetY/vb.clientHeight*vb.h)},{passive:false});
let drag=null;
svg.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y};svg.classList.add('dragging')});
window.addEventListener('mousemove',e=>{if(!drag)return;vb.x=drag.vx-(e.clientX-drag.x)*vb.w/svg.clientWidth;vb.y=drag.vy-(e.clientY-drag.y)*vb.h/svg.clientHeight;applyVB()});
window.addEventListener('mouseup',()=>{drag=null;svg.classList.remove('dragging')});
document.getElementById('zin').onclick=()=>zoom(0.8);
document.getElementById('zout').onclick=()=>zoom(1.25);
document.getElementById('zfit').onclick=()=>{vb={x:0,y:0,w:1640,h:1020};applyVB()};
/* 侧栏 */
const sidebody=document.getElementById('sidebody');
function renderFlows(){
  sidebody.innerHTML='<div class="hint">点击流程名展开，点击步骤在图上高亮。</div>';
  FLOWS.forEach(f=>{
    const d=document.createElement('div');d.className='flow';
    d.innerHTML=`<div class="t">${f.name}<small>${f.steps.length} 步</small></div><ol>${f.steps.map(s=>`<li>${s.t}</li>`).join('')}</ol>`;
    d.querySelector('.t').onclick=()=>d.classList.toggle('open');
    d.querySelectorAll('li').forEach((li,i)=>li.onclick=()=>{
      d.querySelectorAll('li').forEach(x=>x.classList.remove('on'));li.classList.add('on');
      const st=f.steps[i];
      document.querySelectorAll('.node').forEach(n=>{n.classList.toggle('hl',st.n.includes(n.dataset.id));n.classList.toggle('dim',!st.n.includes(n.dataset.id))});
    });
    sidebody.appendChild(d);
  });
}
function setPanel(p){document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.p===p));if(p==='flows'){clearHL();renderFlows()}}
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{setPanel(c.dataset.p)});
function inspect(id){
  document.querySelectorAll('.node').forEach(n=>n.classList.toggle('hl',n.dataset.id===id));
  const n=NODES[id];
  sidebody.innerHTML=`<div class="insp"><h3>${n.name}</h3>
    <section><b>职责</b><p>${n.role}</p></section>
    <section><b>技术</b><p>${n.tech}</p></section>
    ${n.conn?`<section><b>连接</b><ul>${n.conn.map(c=>`<li>${c}</li>`).join('')}</ul></section>`:''}
    ${n.debts?`<section><b>相关压力点</b>${n.debts.map(d=>`<p class="dt" data-d="${d}">${d} · ${DEBTS.flatMap(g=>g.items).find(x=>x.id===d)?.t||''}</p>`).join('')}</section>`:''}
    <p class="hint">点击左上「关键流程」返回。</p></div>`;
  sidebody.querySelectorAll('.dt').forEach(x=>x.onclick=()=>showDebt(x.dataset.d));
  document.querySelector('.chip[data-p="insp"]').classList.add('on');document.querySelector('.chip[data-p="flows"]').classList.remove('on');
}
svg.addEventListener('click',()=>clearHL());
function clearHL(){document.querySelectorAll('.node').forEach(n=>n.classList.remove('hl','dim'))}
/* 压力点页 */
const debtview=document.getElementById('debtview');
function renderDebts(){
  debtview.innerHTML=`<h2 style="color:#e2e8f0;font-size:18px">压力点 · 14 项（P1-P14）</h2><p style="color:var(--muted);font-size:12.5px;margin-top:4px">全部来自代码证据（文件:行号）。修复优先级建议见 AGENT_ARCHITECTURE.md §9。</p><div id="dg"></div>`;
  const dg=debtview.querySelector('#dg');
  DEBTS.forEach(g=>{
    const h=document.createElement('div');h.className='grouphead';h.textContent=g.g;dg.appendChild(h);
    const grid=document.createElement('div');grid.className='debtgrid';dg.appendChild(grid);
    g.items.forEach(d=>{
      const c=document.createElement('div');c.className='dcard';
      c.innerHTML=`<span class="g">${g.g}</span><h3><span class="did">${d.id}</span>${d.t}</h3><p>${d.p}</p><p class="ev">证据 <code>${d.ev}</code></p><p class="rem">${d.r}</p>`;
      grid.appendChild(c);
    });
  });
}
function showDebt(id){switchView('debt');debtview.scrollTop=0;const card=[...debtview.querySelectorAll('.dcard')].find(c=>c.textContent.includes(id));if(card){card.scrollIntoView({behavior:'smooth',block:'center'});card.style.outline='1px solid var(--amber)';setTimeout(()=>card.style.outline='',1600)}}
function switchView(v){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===v));
  document.getElementById('stage').style.display=v==='arch'?'':'none';
  document.getElementById('archside').style.display=v==='arch'?'':'none';
  debtview.style.display=v==='debt'?'block':'none';
  if(v==='debt')renderDebts();
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchView(t.dataset.v));
renderFlows();
</script>
