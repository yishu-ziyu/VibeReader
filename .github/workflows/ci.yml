# 最小 CI（Issue #1 P2）：PR gate = native build + native tests + UniRAG tests
#（含 shared-contract 钉死测试）。真实 GUI / sidecar / 大模型 / 用户核心路径
# 验收不在此跑，保留在 macOS 本机（scripts/acceptance.sh）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native build + PageFlowTests
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Build (Debug)
        run: scripts/build-native.sh
      - name: Unit tests (PageFlowTests)
        run: |
          # An app-hosted runner can stall before XCTest prints its first case.
          # Bound silence and leave a process sample instead of consuming 45 min.
          log="$RUNNER_TEMP/native-test.log"
          scripts/test-native.sh >"$log" 2>&1 &
          test_pid=$!
          last_size=0
          idle_seconds=0
          elapsed_seconds=0
          while ps -p "$test_pid" >/dev/null 2>&1; do
            sleep 30
            elapsed_seconds=$((elapsed_seconds + 30))
            size="$(stat -f %z "$log")"
            if [ "$size" -gt "$last_size" ]; then
              tail -n 12 "$log"
              last_size="$size"
              idle_seconds=0
            else
              idle_seconds=$((idle_seconds + 30))
            fi
            if [ "$idle_seconds" -ge 480 ] || [ "$elapsed_seconds" -ge 900 ]; then
              echo "XCTest exceeded its 8-minute idle or 15-minute total limit; collecting runner state"
              ps -axo pid,ppid,state,etime,command | grep -E 'xcodebuild|xctest|VibeReader|testmanagerd' | tail -30 || true
              sample "$test_pid" 5 -file "$RUNNER_TEMP/xcodebuild.sample" >/dev/null 2>&1 || true
              tail -n 60 "$RUNNER_TEMP/xcodebuild.sample" 2>/dev/null || true
              tail -n 80 "$log"
              kill "$test_pid" 2>/dev/null || true
              exit 124
            fi
          done
          status=0
          wait "$test_pid" || status=$?
          tail -n 100 "$log"
          exit "$status"

  unirag:
    name: UniRAG tests (unit + integration + contract v1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        working-directory: services/uni-rag
        run: uv sync --extra dev
      - name: Tests
        working-directory: services/uni-rag
        env:
          UNI_RAG_LLM_API_KEY: test-key-for-unit-tests
        run: uv run python -m pytest tests/unit tests/integration -q
        # test_contract_v1.py 会向上找到 packages/shared-contracts 的 v1
        # fixtures，即为本 workflow 的 shared contract check。
